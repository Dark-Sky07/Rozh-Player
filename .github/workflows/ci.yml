name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web · typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rozh-web
          path: dist/
          retention-days: 7

  rust:
    name: Rust · cargo check
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable snapshot
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: cargo check
        id: check
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo check --all-targets --message-format=short 2>&1 | tee /tmp/cargo.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Push the compiler output somewhere visible to `gh run view`.
            summary=$(tail -n 60 /tmp/cargo.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo check failed::$summary"
            if [ -n "$GH_TOKEN" ]; then
              gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number || 0 }}/comments" \
                -f body="### ❌ cargo check\n\`\`\`\n$(tail -n 80 /tmp/cargo.log | sed 's/`/'"'"'/g')\n\`\`\`" >/dev/null 2>&1 || true
            fi
            exit "$code"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

  android-bridge:
    name: Android · bridge compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable snapshot
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Android SDK + NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "NDK=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      - run: npm run build
      - name: Scaffold and patch Android project
        run: |
          npx tauri android init --ci
          node scripts/patch-android-tv.mjs
          node scripts/patch-android-native.mjs
      - name: Compile Android Java and Kotlin bridge
        working-directory: src-tauri/gen/android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain :app:compileDebugJavaWithJavac :app:compileDebugKotlin 2>&1 | tee /tmp/android-bridge.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail -n 60 /tmp/android-bridge.log > /tmp/android-bridge-tail.log
            {
              echo '### Android bridge compilation failed'
              echo '```text'
              cat /tmp/android-bridge-tail.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            summary=$(sed -e 's/%/%25/g' -e 's/\r//g' /tmp/android-bridge-tail.log | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android bridge compilation failed::$summary"
            exit "$code"
          fi
