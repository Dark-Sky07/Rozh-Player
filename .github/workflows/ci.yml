name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web · typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rozh-web
          path: dist/
          retention-days: 7

  rust:
    name: Rust · cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: cargo check
        id: check
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo check --all-targets --message-format=short 2>&1 | tee /tmp/cargo.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Push the compiler output somewhere visible to `gh run view`.
            summary=$(tail -n 60 /tmp/cargo.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo check failed::$summary"
            if [ -n "$GH_TOKEN" ]; then
              gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number || 0 }}/comments" \
                -f body="### ❌ cargo check\n\`\`\`\n$(tail -n 80 /tmp/cargo.log | sed 's/`/'"'"'/g')\n\`\`\`" >/dev/null 2>&1 || true
            fi
            exit "$code"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib
