name: Probe

# Temporary diagnostic workflow: builds the two platform targets that are most
# likely to break on a clean runner (Windows bundling and Android), with the
# build output surfaced as check annotations because job logs cannot be
# downloaded from this environment. Triggered by touching `.ci/probe`.
on:
  push:
    branches: ['arena/**']
    paths: ['.ci/probe']

permissions:
  contents: read

jobs:
  windows:
    name: Probe · Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: probe-win
      - run: npm ci
      - name: Build installers
        shell: bash
        run: |
          set +e
          npm run tauri build 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(tail -n 100 /tmp/build.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Windows bundle failed::$summary"
            exit "$code"
          fi
      - name: Bundles
        shell: bash
        run: find src-tauri/target -path '*bundle*' -type f | head -20

  android:
    name: Probe · Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK + NDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
          ls "$SDK" || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: probe-android
      - run: npm ci
      - name: Init Android project
        shell: bash
        run: |
          set +e
          npx tauri android init --ci 2>&1 | tee /tmp/init.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(tail -n 100 /tmp/init.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android init failed::$summary"
            exit "$code"
          fi
      - name: Build APK
        shell: bash
        run: |
          set +e
          npx tauri android build --apk 2>&1 | tee /tmp/android.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(tail -n 120 /tmp/android.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$summary"
            exit "$code"
          fi
      - name: Apks
        shell: bash
        run: find src-tauri/gen/android/app/build/outputs -name '*.apk' -exec ls -lh {} \;
