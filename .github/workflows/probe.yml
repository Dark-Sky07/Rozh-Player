name: Probe

# Temporary diagnostic workflow: builds the two platform targets that are most
# likely to break on a clean runner (Windows bundling and Android), with the
# build output surfaced as check annotations because job logs cannot be
# downloaded from this environment. Triggered by touching `.ci/probe`.
on:
  push:
    branches: ['arena/**']
    paths: ['.ci/probe']

permissions:
  contents: read

jobs:
  windows:
    name: Probe · Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: probe-win
      - run: npm ci
      - name: Build installers
        shell: bash
        run: |
          set +e
          npm run tauri build -- --bundles nsis 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' /tmp/build.log | grep -aiE "error|fail|panic|invalid|nsis|makensis|warning" | tail -n 25 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Windows bundle failed::$summary"
            tail -n 25 /tmp/build.log
            exit "$code"
          fi
      - name: Bundles
        shell: bash
        run: find src-tauri/target -path '*bundle*' -type f | head -20
