name: Signing preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    name: Validate release signing secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci

      - name: Install minisign verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Verify updater key matches the embedded public key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo '::error title=Updater signing::TAURI_SIGNING_PRIVATE_KEY is missing'; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo '::error title=Updater signing::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing'; exit 1; }
          probe="$RUNNER_TEMP/rozh-updater-signing-probe.txt"
          public_key="$RUNNER_TEMP/rozh-updater.pub"
          printf 'ROZH Player updater signing preflight\n' > "$probe"
          npx tauri signer sign --app-version 1.1.1 "$probe"
          PUBLIC_KEY_FILE="$public_key" node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8")); fs.writeFileSync(process.env.PUBLIC_KEY_FILE, Buffer.from(c.plugins.updater.pubkey,"base64"));'
          minisign -Vm "$probe" -p "$public_key" -x "$probe.sig"
          echo 'Updater private key and embedded public key match.'

      - name: Verify Android keystore, alias, and key password
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            test -n "${!name:-}" || { echo "::error title=Android signing::$name is missing"; exit 1; }
          done
          umask 077
          keystore="$RUNNER_TEMP/rozh-signing-preflight.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore" || { echo '::error title=Android signing::decoded keystore is empty'; exit 1; }
          keytool -list -storetype PKCS12 -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          mkdir -p "$RUNNER_TEMP/rozh-signing-test"
          printf 'ROZH Player signing preflight\n' > "$RUNNER_TEMP/rozh-signing-test/probe.txt"
          jar --create --file "$RUNNER_TEMP/rozh-signing-probe.jar" \
            -C "$RUNNER_TEMP/rozh-signing-test" .
          jarsigner -keystore "$keystore" -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$RUNNER_TEMP/rozh-signing-probe.jar" "$ANDROID_KEY_ALIAS" >/dev/null
          jarsigner -verify "$RUNNER_TEMP/rozh-signing-probe.jar" >/dev/null
          echo 'Android keystore, alias, and passwords are valid.'
