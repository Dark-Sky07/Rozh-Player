name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to
        required: true
        default: v1.0.3
      only:
        description: Which platform to build (all, windows, macos, linux, web, android)
        required: true
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}-${{ github.event.inputs.only || 'all' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Updater signing. The key lives in the repository because the release
  # pipeline has to sign every bundle; rotating it would break updates for
  # everyone already on a release, so it must never change.
  #
  # Tauri reads TAURI_SIGNING_PRIVATE_KEY as the key *content*, so the key file
  # is exported into it by the "Load the updater signing key" step below.
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: rozh-updater-key

jobs:
  # ---------------------------------------------------------------- desktop
  desktop:
    name: ${{ matrix.label }}
    # NOTE: the matrix context is not available to a job-level `if`, so the
    # desktop matrix always runs for a tag; the `only` input just selects the
    # single-target jobs. (Step-level `if`s may use matrix.key.)
    if: |
      github.event_name == 'push' ||
      github.event.inputs.only == 'all' ||
      github.event.inputs.only == 'windows' ||
      github.event.inputs.only == 'macos' ||
      github.event.inputs.only == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS runner builds both architectures: the hosted macOS pool
          # queues a second job unpredictably, and a queued job that never
          # starts is cancelled after 15 minutes.
          - key: macos
            label: macOS · Universal
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            expect: darwin-aarch64,darwin-x86_64
          - key: linux
            label: Linux · deb / rpm / AppImage
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
            expect: linux-x86_64
          - key: windows
            label: Windows · x64
            platform: windows-latest
            args: --bundles nsis
            rust-targets: ''
            expect: windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Linux dependencies
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      - name: Load the updater signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s src-tauri/updater/rozh-updater.key || { echo '::error title=updater key::src-tauri/updater/rozh-updater.key is missing'; exit 1; }
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat src-tauri/updater/rozh-updater.key)" >> "$GITHUB_ENV"

      - name: Fetch FFmpeg (optional native engine)
        continue-on-error: true
        run: node scripts/fetch-ffmpeg.mjs

      - name: Build installers (macOS — both architectures)
        if: matrix.key == 'macos'
        shell: bash
        run: |
          set +e
          ( npm run tauri build -- --target aarch64-apple-darwin \
            && npm run tauri build -- --target x86_64-apple-darwin ) 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' /tmp/build.log | grep -aiE "error|fail|panic|invalid" | tail -n 30 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Bundle failed::$summary"
            exit "$code"
          fi

      - name: Build installers
        if: matrix.key != 'macos'
        shell: bash
        run: |
          set +e
          npm run tauri build -- ${{ matrix.args }} 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' /tmp/build.log | grep -aiE "error|fail|panic|invalid|wix|nsis|light.exe|candle.exe" | tail -n 30 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Bundle failed::$summary"
            exit "$code"
          fi

      - name: Collect bundles + updater signatures
        shell: bash
        env:
          ARTIFACT_KEY: ${{ matrix.key }}
          EXPECTED_PLATFORMS: ${{ matrix.expect }}
        run: |
          node scripts/collect-desktop-artifacts.mjs
          ls -lh out
          ls -lh manifest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 'ROZH Player ${{ env.TAG }}'
          body_path: docs/RELEASE_NOTES.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: out/*

      # One manifest per runner; the `latest` job merges them into latest.json.
      - name: Keep the updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-${{ matrix.key }}
          path: manifest/*.json
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------- web
  web:
    name: Web · PWA bundle
    if: |
      github.event_name == 'push' ||
      github.event.inputs.only == 'all' ||
      github.event.inputs.only == 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          cd dist && zip -qr ../rozh-player-web.zip . && cd ..
          ls -la rozh-player-web.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 'ROZH Player ${{ env.TAG }}'
          body_path: docs/RELEASE_NOTES.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: rozh-player-web.zip

  # ---------------------------------------------------------------- android
  android:
    name: Android · APK + AAB
    if: |
      github.event_name == 'push' ||
      github.event.inputs.only == 'all' ||
      github.event.inputs.only == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
          ls "$SDK"
          PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "platforms;android-34" "build-tools;34.0.0"

      - name: NDK env
        run: |
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - run: npm ci

      - name: Scaffold Android project
        shell: bash
        run: npx tauri android init --ci

      - name: Patch Android manifest (cleartext, permissions, leanback)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-android-tv.mjs
          # Device media library: MediaStore scan + SAF folder picker.
          node scripts/patch-android-native.mjs
          test -f src-tauri/gen/android/app/src/main/java/app/rozh/player/MediaBridge.java \
            || { echo '::error title=android-native::MediaBridge.java missing'; exit 1; }
          grep -q 'MediaBridge.attach(this)' src-tauri/gen/android/app/src/main/java/app/rozh/player/MainActivity.kt \
            || { echo '::error title=android-native::MainActivity is not wired to the bridge'; exit 1; }
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' "$M" || { echo '::error title=manifest::cleartext traffic is still off'; exit 1; }
          test "$(grep -c 'android.software.leanback' "$M")" -eq 1 || { echo '::error title=manifest::leanback declared more than once'; exit 1; }
          test "$(grep -c 'android.hardware.touchscreen' "$M")" -eq 1 || { echo '::error title=manifest::touchscreen declared more than once'; exit 1; }
          grep -q 'LEANBACK_LAUNCHER' "$M"
          grep -q 'android.permission.READ_MEDIA_VIDEO' "$M" \
            || { echo '::error title=manifest::media permissions missing'; exit 1; }
          echo 'manifest ok'

      # Every release is signed with the same committed key, so Android treats a
      # new version as an upgrade of the installed app instead of a different
      # application (which is what forces the "uninstall the previous version"
      # dialog). Never regenerate this file.
      - name: Release signing key
        shell: bash
        env:
          KEYSTORE: src-tauri/keystore/rozh-release.p12
        run: |
          set -euo pipefail
          KS="$GITHUB_WORKSPACE/$KEYSTORE"
          test -f "$KS" || { echo '::error title=keystore::src-tauri/keystore/rozh-release.p12 missing'; exit 1; }
          keytool -list -keystore "$KS" -storepass rozhplayer > /tmp/keys.txt
          cat /tmp/keys.txt
          ALIAS=$(grep -i 'PrivateKeyEntry' /tmp/keys.txt | head -1 | cut -d, -f1 | tr -d '[:space:]')
          test -n "$ALIAS" || { echo '::error title=keystore::no private key entry'; exit 1; }
          echo "ROZH_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=rozhplayer
          keyAlias=$ALIAS
          storeFile=$KS
          EOF
          # Tauri's Android template reads these when present.
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=rozhplayer"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=rozhplayer"
            echo "TAURI_KEY_PASSWORD=rozhplayer"
          } >> "$GITHUB_ENV"

      - name: Build APK + AAB
        shell: bash
        run: |
          set +e
          npx tauri android build --apk --aab 2>&1 | tee /tmp/android.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(tail -n 80 /tmp/android.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$summary"
            exit "$code"
          fi

      - name: Sign APK + AAB
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "Building Android artefacts for $VERSION"
          KS="$GITHUB_WORKSPACE/src-tauri/keystore/rozh-release.p12"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          mkdir -p out
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "unsigned: $unsigned"
          "$BT/zipalign" -f -p 4 "$unsigned" out/unsigned-aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ROZH_KEY_ALIAS" \
            --ks-pass pass:rozhplayer --key-pass pass:rozhplayer \
            --out out/"ROZH-Player-$VERSION.apk" out/unsigned-aligned.apk
          rm -f out/*.idsig
          "$BT/apksigner" verify --print-certs out/"ROZH-Player-$VERSION.apk" | head -5
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          if [ -n "$aab" ]; then
            cp "$aab" out/"ROZH-Player-$VERSION.aab"
            jarsigner -keystore "$KS" -storetype PKCS12 -storepass rozhplayer -keypass rozhplayer \
              out/"ROZH-Player-$VERSION.aab" "$ROZH_KEY_ALIAS"
          fi
          rm -f out/unsigned-aligned.apk
          ls -lh out

      # ---------------------------------------------------------- Android TV
      # One web bundle, two packages: the TV build bakes VITE_TV_BUILD=1 so the
      # 10-foot interface is on from the first frame, and takes its own
      # applicationId so it installs next to the phone app.
      - name: Prepare Android TV package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/make-tv-variant.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const gradle = fs.readFileSync('src-tauri/gen/android/app/build.gradle.kts', 'utf8');
          const manifest = fs.readFileSync('src-tauri/gen/android/app/src/main/AndroidManifest.xml', 'utf8');
          const fail = (msg) => {
            console.error(`::error title=TV package::${msg}`);
            process.exit(1);
          };
          if (!/applicationId\s*=?\s*"[^"]*\.tv"/.test(gradle)) fail('applicationId has no .tv suffix');
          if (!manifest.includes('android:label="ROZH Player TV"')) fail('TV label missing');
          if (!/android\.software\.leanback"\s+android:required="true"/.test(manifest)) fail('leanback is not required');
          if (!manifest.includes('@drawable/tv_banner')) fail('banner missing');
          console.log('tv package ok');
          NODE

      - name: Build Android TV APK + AAB
        shell: bash
        env:
          VITE_TV_BUILD: '1'
        run: |
          set +e
          npx tauri android build --apk --aab 2>&1 | tee /tmp/android-tv.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(tail -n 80 /tmp/android-tv.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android TV build failed::$summary"
            exit "$code"
          fi

      - name: Sign Android TV APK + AAB
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          KS="$GITHUB_WORKSPACE/src-tauri/keystore/rozh-release.p12"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "unsigned TV apk: $unsigned"
          "$BT/zipalign" -f -p 4 "$unsigned" out/unsigned-tv-aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ROZH_KEY_ALIAS" \
            --ks-pass pass:rozhplayer --key-pass pass:rozhplayer \
            --out out/"ROZH-Player-TV-$VERSION.apk" out/unsigned-tv-aligned.apk
          rm -f out/*.idsig
          "$BT/apksigner" verify --print-certs out/"ROZH-Player-TV-$VERSION.apk" | head -3
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          if [ -n "$aab" ]; then
            cp "$aab" out/"ROZH-Player-TV-$VERSION.aab"
            jarsigner -keystore "$KS" -storetype PKCS12 -storepass rozhplayer -keypass rozhplayer \
              out/"ROZH-Player-TV-$VERSION.aab" "$ROZH_KEY_ALIAS"
          fi
          rm -f out/unsigned-tv-aligned.apk
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 'ROZH Player ${{ env.TAG }}'
          body_path: docs/RELEASE_NOTES.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: out/*

  # ------------------------------------------------------------- latest.json
  # Tauri's updater polls `releases/latest/download/latest.json`. The desktop
  # jobs each sign their own bundles, so this job merges their manifests, points
  # every platform at the uploaded asset and publishes the file the app reads.
  latest:
    name: Updater manifest
    needs: [desktop]
    if: |-
      always() && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: updater-manifest-*
          path: manifest
          merge-multiple: true

      - name: Build latest.json
        run: |
          ls -la manifest
          node scripts/build-latest-json.mjs manifest latest.json
          cat latest.json
          # surface the mapping as an annotation: run logs are not always
          # reachable, annotations always are
          node -e "
            const j = require('./latest.json');
            for (const [k, v] of Object.entries(j.platforms)) {
              console.log('::notice title=latest.json ' + k + '::' + v.url.split('/').pop());
            }
          "

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 'ROZH Player ${{ env.TAG }}'
          body_path: docs/RELEASE_NOTES.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: latest.json
