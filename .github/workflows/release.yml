name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Validate requested tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" == "$TAG" ]] || { echo '::error title=Release ref::release workflows must run from the requested tag, never a branch'; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error title=Release tag::tag must be vMAJOR.MINOR.PATCH'; exit 1; }
          version="$(node -p "require('./package.json').version")"
          [[ "$TAG" == "v$version" ]] || { echo "::error title=Release tag::tag $TAG does not match package version $version"; exit 1; }
          test -s "docs/releases/$TAG.md" || { echo "::error title=Release notes::docs/releases/$TAG.md is missing"; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$TAG" refs/remotes/origin/main || { echo '::error title=Release tag::tag commit must already be reachable from main'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- desktop
  desktop:
    permissions:
      contents: read
    needs: validate
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS runner builds both architectures: the hosted macOS pool
          # queues a second job unpredictably, and a queued job that never
          # starts is cancelled after 15 minutes.
          - key: macos
            label: macOS · Universal
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            expect: darwin-aarch64,darwin-x86_64
            ffmpeg: ""
          - key: linux
            label: Linux · deb / rpm / AppImage
            platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            expect: linux-x86_64
            ffmpeg: linux-x64
          - key: windows
            label: Windows · x64
            platform: windows-latest
            args: --bundles nsis
            rust-targets: ""
            expect: windows-x86_64
            ffmpeg: win32-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable snapshot
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Linux dependencies
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      - name: Verify updater signing secrets are configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo '::error title=updater signing::TAURI_SIGNING_PRIVATE_KEY Actions secret is required'; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo '::error title=updater signing::TAURI_SIGNING_PRIVATE_KEY_PASSWORD Actions secret is required'; exit 1; }

      - name: Fetch and verify FFmpeg
        if: matrix.key != 'macos'
        shell: bash
        run: node scripts/fetch-ffmpeg.mjs "${{ matrix.ffmpeg }}"

      - name: Build installers (macOS — both architectures)
        if: matrix.key == 'macos'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/fetch-ffmpeg.mjs darwin-arm64
          npm run tauri build -- --target aarch64-apple-darwin 2>&1 | tee /tmp/build-arm64.log
          node scripts/fetch-ffmpeg.mjs darwin-x64
          npm run tauri build -- --target x86_64-apple-darwin 2>&1 | tee /tmp/build-x64.log

      - name: Build installers
        if: matrix.key != 'macos'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm run tauri build -- ${{ matrix.args }} 2>&1 | tee /tmp/build.log

      - name: Collect bundles + updater signatures
        shell: bash
        env:
          ARTIFACT_KEY: ${{ matrix.key }}
          EXPECTED_PLATFORMS: ${{ matrix.expect }}
        run: |
          node scripts/collect-desktop-artifacts.mjs
          ls -lh out
          ls -lh manifest

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-desktop-${{ matrix.key }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

      # One manifest per runner; the publish job merges them into latest.json.
      - name: Keep the updater manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: updater-manifest-${{ matrix.key }}
          path: manifest/*.json
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------- web
  web:
    permissions:
      contents: read
    needs: validate
    name: Web · PWA bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          cd dist && zip -qr ../rozh-player-web.zip . && cd ..
          ls -la rozh-player-web.zip
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-web
          path: rozh-player-web.zip
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------- android
  android:
    permissions:
      contents: read
    needs: validate
    name: Android · APK + AAB
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK + NDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
          ls "$SDK"
          PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "platforms;android-34" "build-tools;34.0.0"

      - name: NDK env
        run: |
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable snapshot
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: android

      - run: npm ci

      - name: Scaffold Android project
        shell: bash
        run: npx tauri android init --ci

      - name: Patch Android manifest (cleartext, permissions, leanback)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-android-tv.mjs
          # Device media library: MediaStore scan + SAF folder picker.
          node scripts/patch-android-native.mjs
          test -f src-tauri/gen/android/app/src/main/java/app/rozh/player/MediaBridge.java \
            || { echo '::error title=android-native::MediaBridge.java missing'; exit 1; }
          grep -q 'MediaBridge.attach(this)' src-tauri/gen/android/app/src/main/java/app/rozh/player/MainActivity.kt \
            || { echo '::error title=android-native::MainActivity is not wired to the bridge'; exit 1; }
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' "$M" || { echo '::error title=manifest::cleartext traffic is still off'; exit 1; }
          test "$(grep -c 'android.software.leanback' "$M")" -eq 1 || { echo '::error title=manifest::leanback declared more than once'; exit 1; }
          test "$(grep -c 'android.hardware.touchscreen' "$M")" -eq 1 || { echo '::error title=manifest::touchscreen declared more than once'; exit 1; }
          grep -q 'LEANBACK_LAUNCHER' "$M"
          grep -q 'android.permission.READ_MEDIA_VIDEO' "$M" \
            || { echo '::error title=manifest::media permissions missing'; exit 1; }
          echo 'manifest ok'

      # Signing keys are provisioned from protected GitHub Actions secrets.
      # The old checked-in keystore and its password were exposed; do not fall
      # back to those compromised values or produce unsigned artifacts.
      - name: Prepare Android signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            test -n "${!name:-}" || { echo "::error title=Android signing::$name Actions secret is required"; exit 1; }
          done
          umask 077
          KS="$RUNNER_TEMP/rozh-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          test -s "$KS" || { echo '::error title=Android signing::decoded keystore is empty'; exit 1; }
          keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo '::error title=Android signing::keystore, password, or alias is invalid'; exit 1; }
          echo "ROZH_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "ROZH_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            echo "TAURI_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$KS
          EOF

      - name: Build APK + AAB
        shell: bash
        run: |
          set +e
          npx tauri android build --apk --aab 2>&1 | tee /tmp/android.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(tail -n 80 /tmp/android.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$summary"
            exit "$code"
          fi

      - name: Sign APK + AAB
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "Building Android artefacts for $VERSION"
          KS="$ROZH_KEYSTORE_PATH"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          mkdir -p out
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "unsigned: $unsigned"
          "$BT/zipalign" -f -p 4 "$unsigned" out/unsigned-aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ROZH_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out out/"ROZH-Player-$VERSION.apk" out/unsigned-aligned.apk
          rm -f out/*.idsig
          "$BT/apksigner" verify --print-certs out/"ROZH-Player-$VERSION.apk" | head -5
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          if [ -n "$aab" ]; then
            cp "$aab" out/"ROZH-Player-$VERSION.aab"
            jarsigner -keystore "$KS" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              out/"ROZH-Player-$VERSION.aab" "$ROZH_KEY_ALIAS"
          fi
          rm -f out/unsigned-aligned.apk
          ls -lh out

      # ---------------------------------------------------------- Android TV
      # One web bundle, two packages: the TV build bakes VITE_TV_BUILD=1 so the
      # 10-foot interface is on from the first frame, and takes its own
      # applicationId so it installs next to the phone app.
      - name: Prepare Android TV package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/make-tv-variant.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const gradle = fs.readFileSync('src-tauri/gen/android/app/build.gradle.kts', 'utf8');
          const manifest = fs.readFileSync('src-tauri/gen/android/app/src/main/AndroidManifest.xml', 'utf8');
          const fail = (msg) => {
            console.error(`::error title=TV package::${msg}`);
            process.exit(1);
          };
          if (!/applicationId\s*=?\s*"[^"]*\.tv"/.test(gradle)) fail('applicationId has no .tv suffix');
          if (!manifest.includes('android:label="ROZH Player TV"')) fail('TV label missing');
          if (!/android\.software\.leanback"\s+android:required="true"/.test(manifest)) fail('leanback is not required');
          if (!manifest.includes('@drawable/tv_banner')) fail('banner missing');
          console.log('tv package ok');
          NODE

      - name: Build Android TV APK + AAB
        shell: bash
        env:
          VITE_TV_BUILD: "1"
        run: |
          set +e
          npx tauri android build --apk --aab 2>&1 | tee /tmp/android-tv.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(tail -n 80 /tmp/android-tv.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android TV build failed::$summary"
            exit "$code"
          fi

      - name: Sign Android TV APK + AAB
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          KS="$ROZH_KEYSTORE_PATH"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "unsigned TV apk: $unsigned"
          "$BT/zipalign" -f -p 4 "$unsigned" out/unsigned-tv-aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ROZH_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out out/"ROZH-Player-TV-$VERSION.apk" out/unsigned-tv-aligned.apk
          rm -f out/*.idsig
          "$BT/apksigner" verify --print-certs out/"ROZH-Player-TV-$VERSION.apk" | head -3
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          if [ -n "$aab" ]; then
            cp "$aab" out/"ROZH-Player-TV-$VERSION.aab"
            jarsigner -keystore "$KS" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              out/"ROZH-Player-TV-$VERSION.aab" "$ROZH_KEY_ALIAS"
          fi
          rm -f out/unsigned-tv-aligned.apk
          ls -lh out

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-android
          path: out/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------- atomic publish
  # No job publishes directly. A public release is created only after every
  # platform build, signing step, and updater-manifest check has succeeded.
  publish:
    permissions:
      contents: write
    name: Publish release
    needs: [desktop, web, android, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: updater-manifest-*
          path: manifest
          merge-multiple: true

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Build updater manifest and verify complete release set
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/build-latest-json.mjs manifest release-assets/latest.json
          for asset in \
            "ROZH-Player_${VERSION}_x64-setup.exe" \
            "ROZH-Player_${VERSION}_aarch64.dmg" \
            "ROZH-Player_${VERSION}_x64.dmg" \
            "ROZH-Player_${VERSION}_amd64.deb" \
            "ROZH-Player-${VERSION}-1.x86_64.rpm" \
            "ROZH-Player_${VERSION}_amd64.AppImage" \
            "ROZH-Player-${VERSION}.apk" \
            "ROZH-Player-${VERSION}.aab" \
            "ROZH-Player-TV-${VERSION}.apk" \
            "ROZH-Player-TV-${VERSION}.aab" \
            rozh-player-web.zip \
            latest.json; do
            test -s "release-assets/$asset" || { echo "::error title=Release asset missing::$asset"; exit 1; }
          done
          echo "Verified all desktop, Android, Android TV, web, and updater assets for v$VERSION"
          ls -lh release-assets

      - uses: softprops/action-gh-release@6680cc089e59314c4460b839412c25fb6a71ce3b # Node 24-compatible pinned commit
        with:
          tag_name: ${{ env.TAG }}
          name: "ROZH Player ${{ env.TAG }}"
          body_path: docs/releases/${{ env.TAG }}.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: release-assets/*
