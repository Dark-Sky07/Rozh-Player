name: Security · no key material

# The repository has already shipped signing material into git history once.
# This check fails a pull request that brings any of it back: a private key file,
# a keystore, or a PEM private-key block inside any text file.
#
# It runs on pull requests and on pushes to main, so a direct push is caught too
# (it cannot be prevented while main has no protection — see
# .github/MAIN-PROTECTION.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Security · no key material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "$zero" ]; then
            # New branch or first push: compare against the parent of head.
            base="$(git rev-parse "$head^" 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
          echo "head=$head" >>"$GITHUB_OUTPUT"
          echo "scanning $base..$head"

      - name: Reject key files
        shell: bash
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]')" in
              *.jks|*.keystore|*.p12|*.pfx|*.pem|*.key|*.p8)
                echo "::error file=$f::key material must never be committed"
                bad=1
                ;;
              */tauri.key|*/tauri.key.pub|*/minisign.key|*/keystore.properties)
                echo "::error file=$f::signing material must never be committed"
                bad=1
                ;;
            esac
          done < <(git diff --name-only --diff-filter=d "$BASE" "$HEAD")
          [ "$bad" -eq 0 ] || { echo '::error title=key material::remove the files above and rotate anything they contained'; exit 1; }
          echo "no key files in the diff"

      - name: Reject private-key blocks
        shell: bash
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          # The patterns are assembled from pieces so that this workflow file
          # never matches itself.
          pem='-----BEGIN '
          ms='untrusted comment: minisign encrypted secret'
          pattern="${pem}[A-Z ]*PRIVATE KEY-----|${pem}OPENSSH PRIVATE KEY|${ms} key"
          # Added lines only, so removing a leaked key is never flagged.
          hits=$(git diff --unified=0 --diff-filter=d "$BASE" "$HEAD" \
            | grep -E '^\+' \
            | grep -vE '^\+\+\+' \
            | grep -nE -- "$pattern" \
            || true)
          if [ -n "$hits" ]; then
            echo "::error title=private key::a private key block was added in this change"
            printf '%s\n' "$hits" | sed -E 's/(-----BEGIN [A-Z ]*PRIVATE KEY-----).*/\1 … hidden/'
            echo 'Rotate that key: once it is in git history it is public.'
            exit 1
          fi
          echo "no private-key blocks in the diff"
