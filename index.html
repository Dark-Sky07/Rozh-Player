<!doctype html>
<html lang="en" dir="ltr" data-theme="ember" data-tv-build="0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <title>ROZH Player</title>
    <meta name="description" content="ROZH Player — a fast, beautiful, universal media player. Windows · macOS · Linux · Android · Android TV · Web." />
    <meta name="theme-color" content="#07090f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/rozh-192.png" />
    <link rel="apple-touch-icon" href="/icons/rozh-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-glow" aria-hidden="true"></div>
      <img class="boot-logo" src="/icons/rozh-logo.png" alt="ROZH Player" />
      <div class="boot-name">ROZH<span>PLAYER</span></div>
      <div class="boot-bar"><i></i></div>
    </div>
    <div id="app" class="app" data-ready="false"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
