[package]
name = "rozh-player"
version = "1.0.7"
description = "ROZH Player — a fast, beautiful, universal media player"
authors = ["ROZH"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/Dark-Sky07/Rozh-Player"

[lib]
name = "rozh_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
# network requests performed in Rust: makes HLS/IPTV panels that do not send
# CORS headers playable inside the webview (Android included)
tauri-plugin-http = "2"
# process restart/relaunch, used by the updater and by the Android installer
tauri-plugin-process = "2"
# In-app updates: signed bundles + latest.json. Desktop only — the Android
# builds update through the system package installer instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
