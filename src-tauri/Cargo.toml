[package]
name = "rozh-player"
version = "1.0.2"
description = "ROZH Player — a fast, beautiful, universal media player"
authors = ["ROZH"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/Dark-Sky07/Rozh-Player"

[lib]
name = "rozh_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
